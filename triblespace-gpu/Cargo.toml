[package]
name = "triblespace-gpu"
version = "0.47.0"
authors = ["⚫️ <jp@bultmann.eu>"]
edition = "2021"
rust-version = "1.92"
description = "Opt-in GPU acceleration backends for TribleSpace"
homepage = "https://trible.space"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/triblespace-gpu"
repository = "https://github.com/triblespace/triblespace-rs"
readme = "README.md"

[package.metadata.docs.rs]
no-default-features = true
features = ["wgpu", "cuda"]

[features]
default = ["wgpu"]
wgpu = ["dep:cubecl", "cubecl/wgpu", "dep:jerky", "dep:itertools"]
cuda = ["dep:cubecl", "cubecl/cuda"]
# Mirror of `triblespace-core/liveness-bitmask`. This crate's device confirm
# kernels are compiled against one liveness layout or the other — a verdict
# word per candidate, or a packed word per 32 candidates written by a plane
# ballot — and a build where the two crates disagree would compile cleanly and
# produce wrong query answers. Cargo features are per-crate, so lib.rs
# const-asserts that this and core's feature agree; enable both or neither.
liveness-bitmask = ["triblespace-core/liveness-bitmask"]

[dependencies]
cubecl = { version = "=0.10.0", default-features = false, features = ["std"], optional = true }
itertools = { version = "0.14.0", optional = true }
jerky = { version = "0.9.0", git = "https://github.com/triblespace/jerky.git", rev = "8a066da4a70eb1188f5c6dca70c009e07aa6d048", default-features = false, features = ["gpu"], optional = true }
triblespace-core = { version = "0.47.0", path = "../triblespace-core", default-features = false }

[dev-dependencies]
rayon = "1.7"
triblespace-core = { version = "0.47.0", path = "../triblespace-core", default-features = false, features = ["parallel"] }

[[example]]
name = "archive_merge"
required-features = ["wgpu"]

[[test]]
name = "batch_confirm_parity"
required-features = ["wgpu"]
